<title>City Docket</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky control bar over day columns of event "stubs"; picks carry a highlighter mark,
   near-home events carry transit route bullets, each partner is a coloured initial. */
:root {
  --bg: #f3f5f2;
  --surface: #ffffff;
  --sunk: #e9ece7;
  --ink: #14181d;
  --muted: #5b636c;
  --line: #d9ded7;
  --accent: #1f55d8;
  --accent-ink: #ffffff;
  --marker: #ffd84a;
  --marker-ink: #2a2200;
  --good: #1c7f47;
  --warn: #9a5b00;
  --shadow: 0 1px 2px rgba(20, 24, 29, .06), 0 6px 18px rgba(20, 24, 29, .06);
  --font-ui: "Archivo", "Helvetica Neue", Arial, system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
  --st-over: #8a5a00; --st-over-bg: #fff2c7;
  --st-cool: #1d4f91; --st-cool-bg: #dbe8fb;
  --st-green: #1c6b41; --st-green-bg: #d5f0e1;
  --c-art: #d9480f; --c-film: #7048e8; --c-music: #d6336c; --c-talks: #1c7ed6; --c-books: #8a5a2b; --c-theater-dance: #c92a2a; --c-comedy: #c99400; --c-food-drink: #5c940d; --c-outdoors: #2b8a3e; --c-community: #0c8599; --c-nightlife: #4c3fbf; --c-kids: #ae3ec9; --c-fitness: #5c6b7a; --c-other: #7a716a;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1114; --surface: #161a1f; --sunk: #1d2228; --ink: #eceff2; --muted: #9aa3ad; --line: #2a3138;
    --accent: #7fa3ff; --accent-ink: #0b1430; --marker: #e7bd1f; --marker-ink: #1d1700; --good: #4cc38a; --warn: #e3a64a;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    --st-over: #f2c35b; --st-over-bg: #3a2d0c; --st-cool: #9cc2ff; --st-cool-bg: #172a46; --st-green: #7fd9a8; --st-green-bg: #13311f;
    --c-art: #ff8a4c; --c-film: #a38bff; --c-music: #ff7aa8; --c-talks: #6fb3ff; --c-books: #d6a46a; --c-theater-dance: #ff7373; --c-comedy: #ffd24a; --c-food-drink: #a6d95a; --c-outdoors: #6fd38a; --c-community: #4fd1e0; --c-nightlife: #9d93ff; --c-kids: #e08cf2; --c-fitness: #a8b5c2; --c-other: #bdb4ad;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1114; --surface: #161a1f; --sunk: #1d2228; --ink: #eceff2; --muted: #9aa3ad; --line: #2a3138;
  --accent: #7fa3ff; --accent-ink: #0b1430; --marker: #e7bd1f; --marker-ink: #1d1700; --good: #4cc38a; --warn: #e3a64a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  --st-over: #f2c35b; --st-over-bg: #3a2d0c; --st-cool: #9cc2ff; --st-cool-bg: #172a46; --st-green: #7fd9a8; --st-green-bg: #13311f;
  --c-art: #ff8a4c; --c-film: #a38bff; --c-music: #ff7aa8; --c-talks: #6fb3ff; --c-books: #d6a46a; --c-theater-dance: #ff7373; --c-comedy: #ffd24a; --c-food-drink: #a6d95a; --c-outdoors: #6fd38a; --c-community: #4fd1e0; --c-nightlife: #9d93ff; --c-kids: #e08cf2; --c-fitness: #a8b5c2; --c-other: #bdb4ad;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-ui); font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px; border-bottom: 1px solid var(--line);
  display: grid; gap: 10px;
}
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.bar > * { min-width: 0; }
.brand { font-weight: 800; font-stretch: 112%; font-size: 20px; letter-spacing: -.01em; margin-right: 6px; }
.brand span { color: var(--ink); }
.brand span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--accent); margin-right: 7px; vertical-align: 1px; }
.range { font-weight: 650; font-size: 15px; min-width: 0; }
.spacer { flex: 1 1 auto; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
#whenSeg { flex-wrap: wrap; border-radius: 16px; }
#filtersToggle { display: none; justify-self: start; }
.swipe-hint { display: none; }

/* Phones and touch screens: bigger targets, collapsible filters, swipe between days */
@media (max-width: 700px), (pointer: coarse) {
  .seg button { padding: 10px 14px; min-height: 42px; font-size: 14px; }
  .chip, select.chip { padding: 9px 13px; min-height: 42px; font-size: 14px; }
  .btn { padding: 10px 15px; min-height: 44px; font-size: 14px; }
  .icon-btn { width: 44px; height: 44px; font-size: 20px; }
  .more-btn { padding: 12px 4px; font-size: 14px; }
  .ev { padding: 12px 11px 12px 10px; }
  .status button { min-height: 52px; font-size: 15px; }
  .drawer .close { width: 44px; height: 44px; }
  .drawer .actions .btn { flex: 1 1 140px; text-align: center; }
  .search { min-height: 44px; font-size: 16px; }
  .pill { padding: 7px 12px; font-size: 13px; }
}
@media (max-width: 700px) {
  #filtersToggle { display: inline-flex; }
  .bar:not(.filters-open) #filters { display: none; }
  .swipe-hint { display: block; color: var(--muted); font-size: 12px; text-align: center; }
}
#viewSeg { max-width: 100%; overflow-x: auto; scrollbar-width: none; }
#viewSeg::-webkit-scrollbar { display: none; }
#viewSeg button { flex: none; }
.feed { display: grid; gap: 18px; }
.feed-sec { display: grid; gap: 8px; }
.feed-sec > header { display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.feed-sec h2 { margin: 0; font-size: 17px; font-weight: 800; font-stretch: 108%; }
.feed-sec .sub { color: var(--muted); font-size: 12.5px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.travel { font-size: 11.5px; color: var(--muted); font-weight: 600; white-space: nowrap; }
.pass-row { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
.status.three { grid-template-columns: 1fr 1fr 1fr; }
.status button.pass[aria-pressed="true"] { background: var(--muted); border-color: var(--muted); color: var(--bg); }
.icon-btn { border: 1px solid var(--line); background: var(--surface); width: 32px; height: 32px; border-radius: 999px; display: inline-grid; place-items: center; font-size: 16px; line-height: 1; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 5px 11px; border-radius: 999px; font-weight: 600; font-size: 13px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
.chip .icn.sm { margin-left: -3px; }
.search { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px; min-width: 0; width: 190px; font-size: 13px; }
select.chip { appearance: none; padding-right: 22px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%; background-size: 4px 4px; background-repeat: no-repeat; }
.people { display: inline-flex; gap: 4px; align-items: center; }
.avatar { width: 26px; height: 26px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; border: 2px solid var(--bg); }
.hint { color: var(--muted); font-size: 12.5px; }
details.more summary { list-style: none; cursor: pointer; }
details.more summary::-webkit-details-marker { display: none; }

main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 14px 40px; display: grid; gap: 16px; }
.notice { background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r); padding: 14px 16px; color: var(--muted); }

/* On view strip */
.onview { display: grid; gap: 8px; }
.onview header { display: flex; align-items: baseline; gap: 10px; }
.onview h2, .day-head h2 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(220px, 260px); gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: thin; }

/* Week grid */
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: start; }
.day { display: grid; gap: 6px; min-width: 0; align-content: start; }
.day-head { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; padding: 2px 2px 4px; border-bottom: 2px solid var(--ink); }
.day-head .dname { font-weight: 800; font-stretch: 110%; font-size: 15px; }
.day-head .dnum { font-family: var(--font-mono); color: var(--muted); font-size: 12px; }
.day.today .day-head { border-bottom-color: var(--accent); }
.day.today .dname { color: var(--accent); }
.day.past { opacity: .55; }
.more-btn { border: 0; background: transparent; color: var(--accent); font-weight: 650; font-size: 12.5px; text-align: left; padding: 4px 2px; }

/* Event stub */
.ev { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 9px 8px 8px; min-width: 0; }
.ev:hover { border-color: var(--muted); }
.ev .t { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); grid-row: span 3; padding-top: 1px; min-width: 40px; display: grid; gap: 5px; align-content: start; justify-items: start; }
.ev .t .d { color: var(--ink); font-weight: 500; }
.icn { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; flex: none; }
.icn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.icn.sm { width: 16px; height: 16px; border-radius: 4px; background: none !important; }
.icn.sm svg { width: 13px; height: 13px; }
.grp { display: grid; gap: 6px; }
.grp-head { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; padding-top: 2px; }
.grp-head .n { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: 12px; }
.slot { border-top: 1px solid var(--line); padding-top: 10px; }
.slot > h3 { font-size: 12px !important; }
.ev .ttl { font-weight: 650; font-size: 13.5px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.ev .ven { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ev .badges { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 2px; }
.ev.pick { border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.ev .marks { position: absolute; right: 6px; top: 6px; display: flex; gap: 2px; }
.ev .marks .avatar { width: 18px; height: 18px; font-size: 9px; border-width: 1.5px; border-color: var(--surface); }
.ev.marked .ttl { padding-right: 24px; }
.compact .ev .ttl { -webkit-line-clamp: 2; }

.tag { font-size: 10.5px; font-weight: 700; letter-spacing: .02em; padding: 1px 6px; border-radius: 999px; background: var(--sunk); color: var(--muted); text-transform: uppercase; }
.tag.pickedby { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--accent); text-transform: none; letter-spacing: 0; font-size: 11px; }
.tag.pickedby::before { content: "Pick · "; font-weight: 600; opacity: .8; }
.tag.rtag { text-transform: none; letter-spacing: 0; font-size: 11px; display: inline-flex; align-items: center; gap: 4px; }
.tag.rtag i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.tag.free { color: var(--good); background: transparent; border: 1px solid currentColor; }
.route { display: inline-grid; place-items: center; min-width: 17px; height: 17px; border-radius: 50%; font-size: 10px; font-weight: 800; color: #fff; padding: 0 3px; font-family: var(--font-ui); }
.route.bus { border-radius: 4px; background: #0b5fae; font-size: 9.5px; padding: 0 4px; }
.route.yellow { color: #111; }

/* Agenda (list + narrow week) */
.agenda { display: grid; gap: 18px; }
.agenda .day-list { display: grid; gap: 6px; }
.agenda .slot { display: grid; gap: 6px; }
.agenda .slot h3 { margin: 6px 0 0; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.agenda .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }

/* Month */
.month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.month .dow { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 0 4px; }
.cell { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-height: 108px; padding: 6px; display: grid; align-content: start; gap: 3px; text-align: left; min-width: 0; }
.cell.out { background: transparent; border-style: dashed; }
.cell.today { border-color: var(--accent); }
.cell .n { display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.cell .n b { color: var(--ink); font-weight: 600; }
.cell .mini { font-size: 11.5px; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 3px; }
.cell .mini span { overflow: hidden; text-overflow: ellipsis; }
.cell .mini.pick { font-weight: 650; }

/* Rhythms */
.due { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.due .lbl { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700; margin-right: 4px; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 700; border: 1px solid transparent; }
.pill.overdue { background: var(--st-over-bg); color: var(--st-over); }
.pill.coolin { background: var(--st-cool-bg); color: var(--st-cool); }
.pill.greenin { background: var(--st-green-bg); color: var(--st-green); }
button.pill { cursor: pointer; }
button.pill[aria-pressed="true"] { border-color: currentColor; }
.rh-list { display: grid; gap: 10px; }
.rh { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; }
.rh-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.rh-name { font-weight: 750; font-size: 16px; }
.rh-meta { color: var(--muted); font-size: 12.5px; }
.meter { height: 6px; border-radius: 999px; background: var(--sunk); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 999px; }
.rh-matches { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 250px); gap: 8px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; scrollbar-width: thin; }
.rh-matches > * { scroll-snap-align: start; }
.rh { content-visibility: auto; contain-intrinsic-size: auto 340px; }
.rh-form { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); align-items: end; }
.rh-form label { display: grid; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
.rh-form input, .rh-form select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 6px 8px; font-size: 13px; color: var(--ink); min-width: 0; }
.rh-form .wide { grid-column: 1 / -1; }

/* Drawer */
.scrim { position: fixed; inset: 0; background: rgba(10, 12, 14, .38); z-index: 40; }
.drawer {
  position: fixed; z-index: 41; background: var(--surface); box-shadow: var(--shadow); overflow-y: auto;
  top: 0; right: 0; bottom: 0; width: min(440px, 100vw); border-left: 1px solid var(--line);
  padding: calc(18px + env(safe-area-inset-top, 0px)) max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) 18px;
  display: grid; gap: 14px; align-content: start;
}
.drawer h2 { margin: 0; font-size: 21px; line-height: 1.2; font-weight: 750; text-wrap: balance; }
.drawer .when { font-family: var(--font-mono); font-size: 13px; }
.drawer .close { position: absolute; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
.drawer .desc { color: var(--ink); font-size: 14px; line-height: 1.5; max-width: 62ch; }
.drawer .meta { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
.drawer .meta a { color: var(--accent); }
.drawer .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.status { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.status button { border: 1.5px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; font-weight: 700; }
.status button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.note { width: 100%; min-height: 64px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px 10px; resize: vertical; }
.partner { background: var(--sunk); border-radius: 10px; padding: 10px 12px; display: grid; gap: 4px; font-size: 13px; }
.section-label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.foot { color: var(--muted); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 6px; border-top: 1px solid var(--line); }
.ok { color: var(--good); } .bad { color: var(--warn); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 999px; font-weight: 600; z-index: 60; font-size: 13px; }

@media (max-width: 900px) {
  .search { width: 100%; order: 10; }
  .drawer { top: auto; left: 0; width: 100%; max-height: 88vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; padding-left: max(18px, env(safe-area-inset-left, 0px)); }
  .cell { min-height: 72px; } .cell .mini { display: none; } .cell .mini:first-of-type { display: block; }
}
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateY(8px); opacity: .6; } } }
</style>

<div class="bar" id="bar">
  <div class="row">
    <div class="brand"><span>City Docket</span></div>
    <button class="icon-btn" id="prev" aria-label="Previous">&lsaquo;</button>
    <button class="btn" id="todayBtn">Today</button>
    <button class="icon-btn" id="next" aria-label="Next">&rsaquo;</button>
    <div class="range" id="range">Loading&hellip;</div>
    <div class="spacer"></div>
    <div class="people" id="people" aria-label="Who is planning"></div>
  </div>
  <div class="row">
    <div class="seg" role="group" aria-label="View" id="viewSeg">
      <button data-view="forus">For us</button><button data-view="week">Week</button><button data-view="day">Day</button><button data-view="month">Month</button><button data-view="list">List</button><button data-view="ours">Ours</button><button data-view="rhythms">Rhythms</button>
    </div>
    <div class="seg" role="group" aria-label="What to show" id="modeSeg">
      <button data-mode="picks" title="Events chosen by your newsletters">Picks</button><button data-mode="all" title="Everything listed">Everything</button>
    </div>
    <div class="seg" role="group" aria-label="When" id="whenSeg">

<script>
(() => {
  'use strict';
  // ---------- constants ----------
  const CAT_LABELS = {
    art: 'Art', film: 'Film', music: 'Music', talks: 'Talks', books: 'Books', 'theater-dance': 'Theater & dance', comedy: 'Comedy',
    'food-drink': 'Food & drink', outdoors: 'Outdoors', community: 'Community', nightlife: 'Nightlife', kids: 'Kids', fitness: 'Fitness', other: 'Other',
  };
  // Each type's colour is a theme token (--c-<type>), so it reads in light and dark.
  const CATS = Object.fromEntries(Object.entries(CAT_LABELS).map(([k, label]) => [k, [label, `var(--c-${k})`]]));
  const CAT_ORDER = Object.keys(CAT_LABELS);
  // Stroke icons on a 24-unit grid (drawn for this page).
  const ICON_PATHS = {
    art: '<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.6-.8 1.6-1.6 0-.9-.7-1.2-.7-2.1 0-.8.7-1.5 1.6-1.5H17a4 4 0 0 0 4-4c0-4.4-4-8.8-9-8.8z"/><circle cx="7.5" cy="10.5" r="1"/><circle cx="10.5" cy="7" r="1"/><circle cx="15" cy="8" r="1"/>',
    film: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
    music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
    talks: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/>',
    books: '<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/>',
    'theater-dance': '<path d="M3 4h10v6a5 5 0 0 1-10 0z"/><path d="M13 8h8v6a5 5 0 0 1-9.2 2.7"/><path d="M6 8h.01M10 8h.01M6.5 12.5c1 .7 2 .7 3 0"/>',
    comedy: '<circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2.2 4 2.2 4-2.2 4-2.2M9 9h.01M15 9h.01"/>',
    'food-drink': '<path d="M4 3v8a3 3 0 0 0 6 0V3M7 3v18M17 3c-2 2-3 4.5-3 7.5h6c0-3-1-5.5-3-7.5zM17 10.5V21"/>',
    outdoors: '<path d="M12 3l6 9h-4l4 6H6l4-6H6z"/><path d="M12 18v3"/>',
    community: '<circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/>',
    nightlife: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/><path d="M17 3v3M15.5 4.5h3"/>',
    kids: '<path d="M12 3a5 5 0 0 0-5 5c0 3 2.5 6 5 7 2.5-1 5-4 5-7a5 5 0 0 0-5-5z"/><path d="M11 17h2l-1-2zM12 17c0 2-2 2.2-2 4"/>',
    fitness: '<path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/>',
    other: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.3 6-5.4-3.1-5.4 3.1 1.3-6L3.4 9.3l6-.7z"/>',
  };
  /** A coloured icon for an event type. `sm` drops the tinted tile (for inline use). */
  function icon(cat, sm) {
    const k = ICON_PATHS[cat] ? cat : 'other';
    const n = document.createElement('span');
    n.className = 'icn' + (sm ? ' sm' : '');
    n.setAttribute('aria-hidden', 'true');

    return n;
  }
  const SOURCES = { local: 'Local venue', repertory: 'Repertory special', fomo: 'fomo.nyc', nycforfree: 'NYC for FREE', skint: 'The Skint', cityhappenings: 'City Happenings', readingthecity: 'Reading the City', fieldnotes: 'field notes', ohmyrockness: 'Oh My Rockness', thoughtgallery: 'Thought Gallery', curated: 'Free museum night' };
  const SHORT = { nycforfree: 'NYC4FREE', skint: 'Skint', cityhappenings: 'City Hap.', readingthecity: 'Reading', fieldnotes: 'Field notes', ohmyrockness: 'OMR', thoughtgallery: 'Thought G.', curated: 'Free night', repertory: 'Repertory', local: 'Local' };
  // Same weights as the pipeline: trusted curators 3, Thought Gallery and repertory specials 2, Oh My Rockness 1.
  const PICK_W = { skint: 3, cityhappenings: 3, readingthecity: 3, fieldnotes: 3, curated: 3, thoughtgallery: 2, repertory: 2, local: 2, ohmyrockness: 1 };
  const HIDDEN = { fitness: 'Fitness classes', 'brand-popup': 'Brand pop-ups', 'chain-cinema': 'Chain cinema showtimes', 'library-program': 'Library classes & kids programs' };
  const ROUTE_COLORS = { '1': '#ee352e', '2': '#ee352e', '3': '#ee352e', '4': '#00933c', '5': '#00933c', '6': '#00933c', '7': '#b933ad', A: '#0039a6', C: '#0039a6', E: '#0039a6', B: '#ff6319', D: '#ff6319', F: '#ff6319', M: '#ff6319', G: '#6cbe45', J: '#996633', Z: '#996633', L: '#a7a9ac', N: '#fccc0a', Q: '#fccc0a', R: '#fccc0a', W: '#fccc0a', S: '#808183', FS: '#808183', GS: '#808183', H: '#808183' };
  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const CAP = { week: { picks: 40, all: 30 }, list: { picks: 80, all: 60 }, day: { picks: 400, all: 250 } };

  // ---------- small helpers ----------
  const $ = s => document.querySelector(s);
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
      else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else if (k === 'style') n.setAttribute('style', v);
      else n.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return n;
  };
  const store = {
    get(k, d) { try { const v = localStorage.getItem('cd:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem('cd:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  };
  const nyFmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York', year: 'numeric', month: '2-digit', day: '2-digit' });
  const today = () => nyFmt.format(new Date());
  const addDays = (d, n) => { const x = new Date(d + 'T12:00:00Z'); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const dow = d => new Date(d + 'T12:00:00Z').getUTCDay();
  const mondayOf = d => addDays(d, -((dow(d) + 6) % 7));
  const dLabel = d => `${DOW[dow(d)]} ${MON[+d.slice(5, 7) - 1]} ${+d.slice(8)}`;
  const hhmm = e => (e.allDay || e.start.length < 16 ? null : e.start.slice(11, 16));
  const clock = t => { if (!t) return 'All day'; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return m ? `${h}:${String(m).padStart(2, '0')}${ap}` : `${h}${ap}`; };
  const dayOf = e => e.start.slice(0, 10);
  const initials = name => (name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') || '?';
  let toastTimer;
  const toast = msg => { clearTimeout(toastTimer); const t = el('div', { class: 'toast', role: 'status', text: msg }); $('#layer').querySelectorAll('.toast').forEach(x => x.remove()); $('#layer').append(t); toastTimer = setTimeout(() => t.remove(), 2600); };

  // ---------- state ----------
  const S = {
    view: store.get('view2', 'forus'),
    when: 'week', expanded: new Set(), showPassed: false,
    mode: store.get('mode', 'picks'),
    anchor: today(),
    f: { free: false, direct: false, both: false, following: false, tod: 'any', boro: '', q: '', rhythm: '', cats: new Set(store.get('cats', [])) },
    showHidden: { fitness: false, 'brand-popup': false, 'chain-cinema': false, 'library-program': false, ...store.get('showHidden', {}) },
    index: null, weeks: new Map(), hiddenWeeks: new Map(), loading: new Map(),
    me: null, canWrite: true, marks: {}, people: {}, dbReady: false,
    rhythms: { items: {}, log: {} }, rhythmsExists: false, editing: null,
    home: null, follow: {}, lite: null, useLite: false,
  };

  // ---------- data ----------
  const expand = (file, payload) => {
    const v = payload.venues || {};
    const fix = e => Object.assign(e, { venue: v[e.v] || { name: 'See listing' }, pickedBy: e.pickedBy || [], src: e.src || [] });
    return { events: (payload.events || []).map(fix), ongoing: (payload.ongoing || []).map(fix) };
  };
  async function getJSON(path) {
    const r = await fetch(path, { cache: 'no-cache' });
    if (!r.ok) throw new Error(`${path}: ${r.status}`);
    return r.json();
  }
  function weeksFor(from, to) { return (S.index?.weeks || []).filter(w => w.to >= from && w.from <= to); }
  async function ensureWeeks(from, to) {
    const tasks = [];
    for (const w of weeksFor(from, to)) {
      const want = [[w.file, S.weeks]];
      if (Object.values(S.showHidden).some(Boolean)) want.push([w.hiddenFile, S.hiddenWeeks]);
      for (const [file, map] of want) {
        if (map.has(w.week) || !file) continue;
        if (!S.loading.has(file)) S.loading.set(file, getJSON(file).then(p => map.set(w.week, expand(file, p))).catch(err => { console.warn(err); map.set(w.week, { events: [], ongoing: [], error: true }); }));
        tasks.push(S.loading.get(file));
      }
    }
    await Promise.all(tasks);
  }
  function eventsIn(from, to) {
    if (S.useLite && S.lite) {
      return { events: S.lite.events.filter(e => dayOf(e) >= from && dayOf(e) <= to), ongoing: S.lite.ongoing.filter(e => e.ongoing.from <= to && e.ongoing.to >= from) };
    }
    const out = []; const seenOngoing = new Set(); const ongoing = [];
    for (const w of weeksFor(from, to)) {
      for (const map of [S.weeks, S.hiddenWeeks]) {
        const wk = map.get(w.week); if (!wk) continue;
        for (const e of wk.events) { const d = dayOf(e); if (d >= from && d <= to) out.push(e); }
        for (const e of wk.ongoing) if (!seenOngoing.has(e.id) && e.ongoing.from <= to && e.ongoing.to >= from) { seenOngoing.add(e.id); ongoing.push(e); }
      }
    }
    return { events: out, ongoing };
  }

  // ---------- marks (shared db) ----------
  const markOf = (uid, id) => S.marks[uid]?.events?.[id];
  const myMark = id => (S.me ? markOf(S.me, id) : undefined);
  const markersOf = id => Object.keys(S.marks).filter(uid => ['interested', 'going'].includes(markOf(uid, id)?.s));
  const passedBy = id => Object.keys(S.marks).filter(uid => markOf(uid, id)?.s === 'pass');
  const isPassed = id => passedBy(id).length > 0 && !markersOf(id).length;
  const isMarked = id => markersOf(id).length > 0;
  const bothInterested = id => { const m = markersOf(id); return m.length >= 2; };

  let db = null, user = null, writeChain = Promise.resolve(), writeTimer = null;
  async function connect() {
    if (!window.claude?.use) { renderPeople(); return; }
    [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (user) {
      S.me = await user.id();
      const can = await user.can('data.write');
      if (can === false) S.canWrite = false;
    }
    if (!S.me) S.canWrite = false;
    if (!db) { S.canWrite = false; renderPeople(); render(); return; }
    db.collection('marks').onSnapshot(snap => {
      const next = {};
      for (const d of snap.docs) if (d.exists) next[d.id] = d.data();
      // Keep my own unsaved edits while a write is pending.
      if (S.me && writeTimer && S.marks[S.me]) next[S.me] = S.marks[S.me];
      S.marks = next; S.dbReady = true;
      refreshPeople(); render();
    }, err => { console.warn('marks subscription ended', err); });
    db.doc('prefs/venues').onSnapshot(snap => {
      S.follow = snap.exists ? { ...(snap.data().follow || {}) } : {}; scoreMemo.clear(); render();
      if (openId) { const e = findEvent(openId); if (e) openDrawer(e); }
    }, err => console.warn('follow subscription ended', err));
    db.doc('home/config').onSnapshot(snap => {
      S.home = snap.exists ? snap.data() : null; transitCache.clear(); render();
    }, err => console.warn('home subscription ended', err));
    db.doc('rhythms/list').onSnapshot(snap => {
      S.rhythmsExists = snap.exists;
      const d = snap.exists ? snap.data() : {};
      if (!rPending) { S.rhythms = { items: { ...(d.items || {}) }, log: { ...(d.log || {}) } }; rVersion++; }
      render();
    }, err => console.warn('rhythms subscription ended', err));
    refreshPeople();
  }
  async function refreshPeople() {
    const ids = [...new Set([...(S.me ? [S.me] : []), ...Object.keys(S.marks)])];
    if (user && ids.length) { try { S.people = await user.profiles(ids); } catch { /* profiles never rejects; defensive */ } }
    renderPeople();
  }
  function person(uid) {
    const p = S.people[uid];
    return { name: uid === S.me ? (p?.name || 'You') : (p?.name || 'Partner'), color: p?.color || (uid === S.me ? '#1f55d8' : '#c2410c'), me: uid === S.me };
  }
  function avatar(uid, small) {
    const p = person(uid);
    return el('span', { class: 'avatar', style: `background:${p.color}`, title: p.me ? 'You' : p.name, text: initials(p.name) });
  }
  function renderPeople() {
    const box = $('#people'); box.replaceChildren();
    const ids = [...new Set([...(S.me ? [S.me] : []), ...Object.keys(S.marks)])];
    for (const id of ids) box.append(avatar(id));
    if (!S.me) box.append(el('span', { class: 'hint', text: db ? 'View only' : '' }));
  }
  function setMark(e, patch) {
    if (!S.me || !S.canWrite) { toast('Marks are view-only for you on this page.'); return; }
    const mine = S.marks[S.me] ? structuredClone(S.marks[S.me]) : { events: {} };
    mine.events = mine.events || {};
    const cur = mine.events[e.id] || {};
    const next = { ...cur, ...patch, at: Date.now(), t: e.title, d: e.start, e: e.end || null, v: e.venue?.name || '', a: e.venue?.address || '', u: e.url, c: e.category };
    for (const k of Object.keys(next)) if (next[k] === undefined) delete next[k];
    if (!next.s && !next.n) delete mine.events[e.id]; else mine.events[e.id] = next;
    // Prune marks for events more than 60 days past to stay well under the document size limit.
    const cutoff = addDays(today(), -60);
    for (const [k, m] of Object.entries(mine.events)) if ((m.d || '').slice(0, 10) < cutoff) delete mine.events[k];
    S.marks[S.me] = mine;
    render(); if (openId === e.id) openDrawer(e);
    clearTimeout(writeTimer);
    writeTimer = setTimeout(() => {
      const body = structuredClone(S.marks[S.me]);
      writeTimer = null;
      writeChain = writeChain.then(() => db.doc('marks/' + S.me).set(body)).catch(err => {
        console.warn('save failed', err);
        if (err?.code === 'invalid_argument') { S.canWrite = false; toast('This page is view-only for you. Ask for Contributor access to save marks.'); }
        else if (err?.code === 'quota_exceeded') toast('Saved marks are full. Remove some old ones.');
        else toast('Could not save that mark. Try again.');
      });
    }, 450);
  }

  // ---------- per-render caches (the Rhythms and For us views score thousands of events) ----------
  let epoch = 0;                         // bumped at the start of every render
  let rVersion = 0;                      // bumped whenever rhythms change
  const scoreMemo = new Map();           // event -> effScore, this render
  const hayOf = e => e._hay || (e._hay = `${e.title} ${e.venue?.name || ''} ${(e.tags || []).join(' ')} ${e.description || ''}`.toLowerCase());

  // ---------- transit from home (computed here; home lives only in the page's private database) ----------
  const transitCache = new Map();
  const metres = (aLat, aLng, bLat, bLng) => {
    const R = 6371000, rad = d => d * Math.PI / 180;
    const h = Math.sin(rad(bLat - aLat) / 2) ** 2 + Math.cos(rad(aLat)) * Math.cos(rad(bLat)) * Math.sin(rad(bLng - aLng) / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  };
  /** { transit?: {tier, routes, walkM}, homeKm } for an event's venue, or null without a home or coordinates. */
  function geoOf(e) {
    const v = e.venue; const H = S.home;
    if (!H || v?.lat == null || v?.lng == null) return null;
    const key = `${v.lat},${v.lng}`;
    if (transitCache.has(key)) return transitCache.get(key);
    const out = { homeKm: Math.round(metres(H.lat, H.lng, v.lat, v.lng) / 100) / 10 };
    for (const [tier, routes] of [[1, H.tier1 || []], [2, H.tier2 || []]]) {
      let best = Infinity; const hit = [];
      for (const r of routes) {
        let near = Infinity;
        for (const [sLat, sLng] of (H.stops || {})[r] || []) {
          if (Math.abs(sLat - v.lat) > 0.006 || Math.abs(sLng - v.lng) > 0.008) continue;
          near = Math.min(near, metres(v.lat, v.lng, sLat, sLng));
        }
        if (near <= 400) { hit.push(r); best = Math.min(best, near); }
      }
      if (hit.length) { out.transit = { tier, routes: hit, walkM: Math.round(best) }; break; }
    }
    transitCache.set(key, out);
    return out;
  }
  const transitOf = e => e.transit || geoOf(e)?.transit || null;
  const homeKmOf = e => e.homeKm ?? geoOf(e)?.homeKm ?? null;
  /** The ranking nudge for being easy to reach: same weights the pipeline used before it moved here. */
  function homeBonus(e) {
    if (e.transit || e.homeKm != null) return 0; // already counted in a legacy score
    const g = geoOf(e); if (!g) return 0;
    return (g.transit?.tier === 1 ? 1 : g.transit?.tier === 2 ? 0.5 : 0) + (g.homeKm < 3 ? 0.5 : 0);
  }

  // ---------- rhythms (how often we want to do each kind of thing) ----------
  // Status follows the owner's sheet: Greenin (< 75% of the goal), Coolin (75-100%), Overdue (past the goal).
  const RSTATE = { overdue: 'Overdue', coolin: 'Coolin', greenin: 'Greenin' };
  const daysBetween = (a, b) => Math.round((Date.parse(b + 'T12:00:00Z') - Date.parse(a + 'T12:00:00Z')) / 864e5);
  let rItemsCache = null, rItemsVer = -1;
  const rItems = () => {
    if (rItemsVer !== rVersion) {
      rItemsCache = Object.entries(S.rhythms.items || {}).filter(([, r]) => r && !r.archived).map(([id, r]) => ({ id, ...r, _words: (r.words || []).map(w => w.toLowerCase().trim()).filter(Boolean) }));
      rItemsVer = rVersion;
    }
    return rItemsCache;
  };
  function rStatus(r, onDate = today()) {
    if (!r.last) return { state: 'overdue', ratio: 9, since: null, dueIn: -999 };
    const since = Math.max(0, daysBetween(r.last, onDate));
    const ratio = since / Math.max(1, r.goalDays);
    const state = ratio > 1 ? 'overdue' : ratio >= 0.75 ? 'coolin' : 'greenin';
    return { state, ratio, since, dueIn: r.goalDays - since };
  }
  const rOrder = (a, b) => rStatus(b).ratio - rStatus(a).ratio || a.name.localeCompare(b.name);
  function rMatches(r, e) {
    const cats = r.cats || []; const words = r._words || (r.words || []).map(w => w.toLowerCase().trim()).filter(Boolean);
    if (!cats.length && !words.length) return false;
    if (cats.length && !cats.includes(e.category)) return false;
    if (!words.length) return true;
    const hay = hayOf(e);
    return words.some(w => hay.includes(w));
  }
  const eventRhythms = e => {
    if (e._rhVer !== rVersion) { e._rh = rItems().filter(r => rMatches(r, e)); e._rhVer = rVersion; }
    return e._rh;
  };
  /** Score nudge from rhythms, judged on the event's own date: demote right after doing it, lift as it comes due. */
  function rBoost(e) {
    if (e._rbEpoch === epoch) return e._rb;
    e._rbEpoch = epoch; e._rb = rBoostRaw(e); return e._rb;
  }
  function rBoostRaw(e) {
    const rs = eventRhythms(e); if (!rs.length) return 0;
    const day = e.ongoing ? today() : dayOf(e);
    let best = -Infinity;

    const nav = !['ours', 'rhythms', 'forus'].includes(S.view);
    $('#whenSeg').hidden = S.view !== 'forus';
    for (const b of document.querySelectorAll('#whenSeg button')) b.setAttribute('aria-pressed', String(b.dataset.when === S.when));
    $('#prev').hidden = !nav; $('#next').hidden = !nav; $('#todayBtn').hidden = !nav;
    $('#modeSeg').hidden = !nav;
    $('#filters').hidden = S.view === 'rhythms';
  }
  function footer() {
    const ix = S.index; if (!ix) return null;
    const when = new Date(ix.generatedAt);
    const f = el('footer', { class: 'foot' }, el('span', { text: `Updated ${when.toLocaleString('en-US', { timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}` }));
    for (const [id, s] of Object.entries(ix.sources || {})) f.append(el('span', { class: s.ok ? 'ok' : 'bad', title: s.error || '', text: `${s.ok ? '●' : '○'} ${SOURCES[id] || id}${s.ok ? '' : ' (failed)'}` }));
    f.append(el('span', { text: `Listings ${shortDate(ix.window.from)} – ${shortDate(ix.window.to)}` }));
    return f;
  }
  let renderToken = 0;
  async function render() {
    epoch++; scoreMemo.clear(); passIndex = null;
    syncControls();
    const token = ++renderToken;
    const main = $('#main');
    if (!S.index) return;
    if (!['ours', 'rhythms'].includes(S.view)) {
      const [from, to] = S.view === 'forus' ? whenRange(S.when) : rangeFor();
      const pending = weeksFor(from, to).some(w => !S.weeks.has(w.week) || (Object.values(S.showHidden).some(Boolean) && !S.hiddenWeeks.has(w.week)));
      if (pending && S.view === 'forus' && S.lite) {
        // Show the quick-start picks now; re-render with everything once the full weeks arrive.
        S.useLite = true;
        ensureWeeks(from, to).then(() => { if (token === renderToken) render(); });
      } else if (pending) {
        S.useLite = false;
        if (!main.querySelector('.agenda, .feed')) main.replaceChildren(emptyNote('Loading listings…'));
        await ensureWeeks(from, to);
        if (token !== renderToken) return;
      } else S.useLite = false;
    } else {
      const from = today();
      await ensureWeeks(from, addDays(from, S.view === 'rhythms' ? 31 : 34));
      if (token !== renderToken) return;
    }
    let body;
    if (S.view === 'week') body = viewWeek(mondayOf(S.anchor));
    else if (S.view === 'list') body = viewList(mondayOf(S.anchor));
    else if (S.view === 'day') body = viewDay(S.anchor);
    else if (S.view === 'month') body = viewMonth(S.anchor);
    else if (S.view === 'rhythms') body = viewRhythms();
    else if (S.view === 'forus') body = viewForUs();
    else body = viewOurs();
    const swipe = ['day', 'week', 'list', 'month', 'forus'].includes(S.view) ? el('div', { class: 'swipe-hint', text: S.view === 'forus' ? 'Swipe left or right to change the time window' : `Swipe left or right for the ${S.view === 'month' ? 'next month' : S.view === 'day' ? 'next day' : 'next week'}` }) : null;
    main.replaceChildren(...(swipe ? [swipe] : []), body, footer() || '');
  }

  // ---------- controls ----------
  function buildFilters() {
    const cats = $('#cats');
    for (const [k, [label, color]] of Object.entries(CATS)) {
      const b = el('button', { class: 'chip', 'aria-pressed': String(S.f.cats.has(k)), onclick: () => { S.f.cats.has(k) ? S.f.cats.delete(k) : S.f.cats.add(k); store.set('cats', [...S.f.cats]); b.setAttribute('aria-pressed', String(S.f.cats.has(k))); render(); } },
        icon(k, true), label);
      cats.append(b);
    }
    cats.append(el('button', { class: 'more-btn', onclick: () => { S.f.cats.clear(); store.set('cats', []); cats.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', 'false')); render(); }, text: 'Clear' }));
    const ht = $('#hiddenToggles');
    ht.append(el('span', { class: 'hint', text: 'Hidden unless you turn them on:' }));
    const pb = el('button', { class: 'chip', 'aria-pressed': 'false', onclick: () => { S.showPassed = !S.showPassed; pb.setAttribute('aria-pressed', String(S.showPassed)); render(); } }, 'Not for us');
    setTimeout(() => ht.append(pb), 0);
    for (const [k, label] of Object.entries(HIDDEN)) {
      const b = el('button', { class: 'chip', 'aria-pressed': String(!!S.showHidden[k]), onclick: () => { S.showHidden[k] = !S.showHidden[k]; store.set('showHidden', S.showHidden); b.setAttribute('aria-pressed', String(S.showHidden[k])); render(); } }, label);
      ht.append(b);
    }
  }
  $('#whenSeg').addEventListener('click', ev => { const w = ev.target.closest('button')?.dataset.when; if (w) { S.when = w; render(); } });
  $('#viewSeg').addEventListener('click', ev => { const v = ev.target.closest('button')?.dataset.view; if (v) setView(v); });
  $('#modeSeg').addEventListener('click', ev => { const m = ev.target.closest('button')?.dataset.mode; if (m) { S.mode = m; store.set('mode', m); render(); } });
  $('#prev').onclick = () => step(-1); $('#next').onclick = () => step(1);
  $('#todayBtn').onclick = () => { S.anchor = today(); render(); };
  $('#filtersToggle').onclick = () => { const open = $('#bar').classList.toggle('filters-open'); $('#filtersToggle').setAttribute('aria-expanded', String(open)); };
  $('#fFree').onclick = () => { S.f.free = !S.f.free; render(); };
  $('#fDirect').onclick = () => { S.f.direct = !S.f.direct; render(); };
  $('#fBoth').onclick = () => { S.f.both = !S.f.both; render(); };
  $('#fFollow').onclick = () => { S.f.following = !S.f.following; render(); };
  $('#fTod').onchange = ev => { S.f.tod = ev.target.value; render(); };
  $('#fBoro').onchange = ev => { S.f.boro = ev.target.value; render(); };
  let qTimer; $('#q').addEventListener('input', ev => { clearTimeout(qTimer); qTimer = setTimeout(() => { S.f.q = ev.target.value.trim().toLowerCase(); render(); }, 180); });
  let lastNarrow = window.matchMedia('(max-width: 900px)').matches;
  window.addEventListener('resize', () => { const n = window.matchMedia('(max-width: 900px)').matches; if (n !== lastNarrow) { lastNarrow = n; render(); } });

  // ---------- swipe (phones): left/right moves between days, weeks, months or time presets ----------
  let touch = null;
  $('#main').addEventListener('touchstart', ev => {
    if (ev.touches.length !== 1 || ev.target.closest('.strip, .rh-matches, input, textarea, select')) { touch = null; return; }
    touch = { x: ev.touches[0].clientX, y: ev.touches[0].clientY, t: Date.now() };
  }, { passive: true });
  $('#main').addEventListener('touchend', ev => {
    if (!touch) return;
    const dx = ev.changedTouches[0].clientX - touch.x, dy = ev.changedTouches[0].clientY - touch.y, dt = Date.now() - touch.t;
    touch = null;
    if (dt > 700 || Math.abs(dx) < 70 || Math.abs(dx) < 1.6 * Math.abs(dy)) return;
    const dir = dx < 0 ? 1 : -1;
    if (['day', 'week', 'list', 'month'].includes(S.view)) { step(dir); window.scrollTo({ top: 0 }); return; }
    if (S.view === 'forus') {
      const order = ['week', 'tonight', 'tomorrow', 'weekend', 'nextweek'];
      S.when = order[(order.indexOf(S.when) + dir + order.length) % order.length];
      render(); window.scrollTo({ top: 0 });
    }
  }, { passive: true });

  // ---------- boot ----------
  buildFilters();
  syncControls();
  getJSON('index.json').then(async ix => {
    S.index = ix;
    if (ix.lite && S.view === 'forus') { try { S.lite = expand(ix.lite, await getJSON(ix.lite)); } catch (err) { console.warn('quick-start file did not load', err); } }
    render();
  }).catch(err => {
    console.warn(err);
    $('#main').replaceChildren(emptyNote('The listings file did not load. The daily update may still be running; reload in a minute.'));
  });
  connect().catch(err => console.warn('connect failed', err));
})();
</script>
