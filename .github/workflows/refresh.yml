# Collect all sources on GitHub's free runners and save the week files to the `data` branch.
# A short scheduled Claude run then copies them onto the City Docket page (see DAILY.md).
# Nothing here knows the owner's home: NYC_HOME_* is never set, so the output has no
# transit or distance fields; the page computes those itself from its private database.
name: Refresh listings

on:
  schedule:
    # GitHub's scheduler can skip or delay a run, so there is a second try; it exits early
    # when today's listings are already on the data branch.
    - cron: '40 10 * * 1,4'   # Mon and Thu, 5:40am New York in winter (6:40am in summer)
    - cron: '25 11 * * 1,4'   # backup, 45 minutes later
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Skip if today's listings already exist (backup schedule only)
        id: fresh
        if: github.event_name == 'schedule'
        run: |
          if git fetch -q --depth 1 origin data 2>/dev/null && git show FETCH_HEAD:index.json > /tmp/ix.json 2>/dev/null; then
            built=$(node -e "const d=new Date(require('/tmp/ix.json').generatedAt);console.log(d.toLocaleDateString('en-CA',{timeZone:'America/New_York'}))")
            today=$(TZ=America/New_York date +%F)
            if [ "$built" = "$today" ]; then echo "Listings for $today already built; nothing to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; fi
          fi

      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        if: steps.fresh.outputs.skip != 'true'
        run: npm ci

      - name: Test
        if: steps.fresh.outputs.skip != 'true'
        run: npm test

      - name: Install a headless browser (this job only)
        if: steps.fresh.outputs.skip != 'true'
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Collect and build
        if: steps.fresh.outputs.skip != 'true'
        run: npm run pipeline

      - name: Check the output holds nothing about home
        if: steps.fresh.outputs.skip != 'true'
        run: |
          if grep -l -E '"(homeKm|transit)"' dist/*.json; then
            echo "dist/ contains home-derived fields; refusing to publish" >&2
            exit 1
          fi
          node -e "const ix=require('./dist/index.json'); for (const [k,s] of Object.entries(ix.sources)) console.log((s.ok?'ok  ':'FAIL')+' '+k+' '+s.count+(s.error?' '+s.error:''))"

      - name: Save week files to the data branch
        if: steps.fresh.outputs.skip != 'true'
        run: |
          mkdir -p /tmp/data && cp dist/*.json /tmp/data/
          cd /tmp/data
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Listings $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
